timezone = "UTC"
allow_secondly = false
log_retention_days = 90
default_model = "default"
default_timeout = 300
default_retries = 0
mode = "agent"

[buckets]
secondly = "* * * * * *"
minutely = "* * * * *"
hourly = "5 * * * *"
daily = "0 3 * * *"
weekly = "0 4 * * 1"
monthly = "0 5 1 * *"
yearly = "0 6 1 1 *"
